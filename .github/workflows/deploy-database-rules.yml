name: Deploy Firebase DB rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "database.rules.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-database-rules.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Realtime Database rules
        run: npx firebase-tools@latest deploy --only database --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
